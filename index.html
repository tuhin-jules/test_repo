<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomarker Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>Biomarker Tracker</h1>
        <form id="biomarker-form">
            <select id="marker-name" required>
                <option value="" disabled selected>Select Biomarker</option>
                <option value="Hemoglobin">Hemoglobin</option>
                <option value="Cholesterol">Cholesterol</option>
                <option value="Glucose">Glucose</option>
                <option value="Vitamin D">Vitamin D</option>
                <option value="Iron">Iron</option>
            </select>
            <input type="number" id="marker-value" placeholder="Value" step="any" required>
            <input type="date" id="marker-date" required>
            <button type="submit">Add Biomarker</button>
        </form>
        <div id="biomarker-list"></div>
        <div class="chart-container">
            <canvas id="biomarker-chart"></canvas>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
