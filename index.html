<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Bucket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="pipe"></div>
        <div id="water-stream"></div>
        <div id="bucket-container">
            <div id="bucket">
                <div id="water"></div>
            </div>
        </div>
        <div id="splash"></div>
        <input type="range" id="water-slider" min="0" max="100" value="0">
    </div>
    <script src="script.js"></script>
</body>
</html>
